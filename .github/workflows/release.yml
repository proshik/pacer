name: release

# Cuts a release from master by hand: Actions → release → Run workflow.
# The image goes to ghcr.io/proshik/pacer with the workflow's own token.
# The next version is the latest vX.Y.Z tag bumped by the chosen part. The
# image is published first, so a failed push leaves no tag behind; then the
# tag is pushed and a draft release is opened with GitHub's list of changes,
# to be edited and published by hand.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        options:
          - patch
          - minor
          - major
        default: minor

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - name: Only from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Releases are cut from master, not ${GITHUB_REF}"
          exit 1

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Next version
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) major=$((${major:-0} + 1)); minor=0; patch=0 ;;
            minor) minor=$((${minor:-0} + 1)); patch=0 ;;
            patch) patch=$((${patch:-0} + 1)) ;;
          esac
          tag="v${major:-0}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists"
            exit 1
          fi
          echo "${latest:-none} -> $tag ($BUMP)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  verify:
    needs: version
    uses: ./.github/workflows/ci.yml
    # A called workflow may not ask for more than its caller grants, and the
    # tag publish job in ci.yml asks for packages even though it is skipped here.
    permissions:
      contents: read
      packages: write

  image:
    needs:
      - version
      - verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      # The builder cross-compiles, but the final stage's RUN steps execute
      # on the target platform, so arm64 still needs emulation.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # GitHub Container Registry takes the workflow's own token: no secrets.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          # The source label links the package to this repository.
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ needs.version.outputs.tag }}

  release:
    needs:
      - version
      - image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      # A tag pushed with GITHUB_TOKEN does not start other workflows, so the
      # tag build in ci.yml does not publish the image a second time.
      - name: Tag
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Pacer ${TAG#v}" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" --verify-tag --draft --generate-notes --title "Pacer ${TAG#v}"
          echo "Draft: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
