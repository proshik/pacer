name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # build.sh compiles the browser bundle with TinyGo; it uses the Go
      # toolchain installed above, which TinyGo 0.42 supports (Go 1.23-1.27).
      - uses: acifani/setup-tinygo@v3
        with:
          tinygo-version: "0.42.0"

      - name: Test
        run: go test -race ./ ./pkg/...

      - name: Vet
        run: go vet ./ ./pkg/...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13

      - name: Build WASM
        run: ./build.sh

      # The image ships the committed artifacts, so a stale json.wasm or
      # calc.wasm has to fail here rather than reach production.
      - name: Check the committed wasm is current
        run: git diff --exit-code -- assets/json.wasm assets/wasm_exec.js pkg/wasmcalc/calc.wasm

      - name: Build app
        run: go build ./ ./pkg/...

  docker-build:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          push: false
          tags: gorun-ci:local

  docker-publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - verify
      - docker-build
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            proshik/pacer:latest
            proshik/pacer:${{ github.ref_name }}
