<html lang="en">
<head>
    <meta charset="utf-8"/>
    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("json.wasm"), go.importObject).then((result) => {
            go.run(result.instance);
        });
    </script>

    <style>
        .divTable {
            display: table;
        }

        .divTableRow {
            display: table-row;
        }

        .divTableCell, .divTableHead {
            display: table-cell;
            padding: 3px 10px;
        }

        .divTableCellDirectionButton {
            text-align: center;
        }

        .divTableCellConvertButton {
            border: 10px;
            text-align: right
        }

        .divTableBody {
            display: table-row-group;
        }

        .selectCurrency {
            width: 120px;
        }
    </style>

    <title>go-run</title>
</head>
<body>

<textarea id="jsoninput" name="jsoninput" cols="80" rows="20"></textarea>
<input id="button" type="submit" name="button" value="pretty json" onclick="json(jsoninput.value)"/>
<textarea id="jsonoutput" name="jsonoutput" cols="80" rows="20"></textarea>

<br/>
<input id="distInput" type="number" style="-webkit-appearance: none; margin: 0;" name="distInput" value="21097"
       onkeyup="pace()"/>метров
<input type="range" min="0" max="100000" id="line" oninput="testMy()" value="21097" style="width: 400px" onchange="pace()">
<br/>

<input id="timeHourInput" type="number" name="timeHour" value="1" onkeyup="pace()">ч
<input id="timeMinuteInput" type="number" name="timeMinute" value="25" onkeyup="pace()">м
<input id="timeSecondInput" type="number" name="timeSecond" value="39" onkeyup="pace()">с
<br/>
<input id="paceMinuteInput" type="number" name="paceMinute" value="4">м
<input id="paceSecondInput" type="number" name="paceSecond" value="4">с

</body>

        line.value = distInputValue

        line = document.getElementById("line").value;

</script>

</html>
