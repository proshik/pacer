<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <meta charset="utf-8"/>
    <!-- Plugin CSS file with desired skin -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/ion-rangeslider/2.3.1/css/ion.rangeSlider.min.css"/>
    <!-- jQuery -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <!-- Plugin JavaScript file -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ion-rangeslider/2.3.1/js/ion.rangeSlider.min.js"></script>
    <!-- Wasm js -->
    <script src="wasm_exec.js"></script>
    <script>
        wasm_filename = "json.wasm";

        function message(s) {
            document.getElementById("message").textContent = s;
        }

        function load_wasm() {
            if (!WebAssembly.instantiateStreaming) { // polyfill
                WebAssembly.instantiateStreaming = async (resp, importObject) => {
                    const source = await (await resp).arrayBuffer();
                    return await WebAssembly.instantiate(source, importObject);
                };
            }

            const go = new Go();

            WebAssembly.instantiateStreaming(fetch(wasm_filename), go.importObject)
                .then(results => {
                    go.run(results.instance);

                    let elements = document.getElementsByClassName("disabled");
                    for (let i = 0; i < elements.length; i++) {
                        elements.item(i).disabled = false;
                    }

                    let slider = $("#slider");
                    let instance = slider.data("ionRangeSlider");
                    instance.update({
                        disable: false
                    });

                    $("#b1km").prop("disabled", false);
                    $("#b3km").prop("disabled", false);
                    $("#b5km").prop("disabled", false);
                    $("#b10km").prop("disabled", false);
                    $("#b21km").prop("disabled", false);
                    $("#b42km").prop("disabled", false);
                    $("#b50km").prop("disabled", false);
                    $("#b50mile").prop("disabled", false);
                    $("#b100km").prop("disabled", false);
                    $("#b100mile").prop("disabled", false);

                })
                .catch((err) => {
                    // message("Error Loading WebAssembly - " + err);
                    alert(err);
                });
        }

        load_wasm()
    </script>

    <style>
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>

    <title>Pacer</title>
</head>
<body>

<div class="container pt-3 my-3">
    <div class="mb-4">
        <div class="mx-auto">
            <h1>Pacer</h1>
        </div>
    </div>

    <form>
        <div class="form-row">
            <div class="form-group col-md-2">
                <label for="distInput">Дистанция</label>
                <div class="input-group">
                    <input id="distInput" class="form-control disabled" type="number"
                           style="-webkit-appearance: none; margin: 0;" name="distInput" value="21097"
                           onkeyup="pace()" disabled/>
                    <div class="input-group-append">
                        <span class="input-group-text">метров</span>
                    </div>
                </div>
            </div>
            <div class="form-group col-md-8">
                <button type="button" id="b1km" value="1000" class="btn btn-primary btn-sm mb-2" disabled>1 км</button>
                <button type="button" id="b3km" value="3000" class="btn btn-primary btn-sm mb-2" disabled>3 км</button>
                <button type="button" id="b5km" value="5000" class="btn btn-primary btn-sm mb-2" disabled>5 км</button>
                <button type="button" id="b10km" value="10000" class="btn btn-primary btn-sm mb-2" disabled>10 км
                </button>
                <button type="button" id="b21km" value="21097" class="btn btn-primary btn-sm mb-2" disabled>Half
                    Marathon
                </button>
                <button type="button" id="b42km" value="42195" class="btn btn-primary btn-sm mb-2" disabled>Marathon
                </button>
                <button type="button" id="b50km" value="50000" class="btn btn-primary btn-sm mb-2" disabled>50 км
                </button>
                <button type="button" id="b50mile" value="80467" class="btn btn-primary btn-sm mb-2" disabled>50 миль
                </button>
                <button type="button" id="b100km" value="100000" class="btn btn-primary btn-sm mb-2" disabled>100 км
                </button>
                <button type="button" id="b100mile" value="160934" class="btn btn-primary btn-sm mb-2" disabled>100 миль
                </button>

                <label for="slider">&nbsp;</label>
                <input type="text" class="form-control" id="slider"/>
            </div>
        </div>
        <div class="form-row d-inline-flex">
            <div class="form-group col">
                <label for="timeHourInput">Время</label>
                <div class="input-group" style="width: 83px">
                    <input id="timeHourInput" class="form-control disabled" type="number" name="timeHour" value="1"
                           onkeyup="pace()" disabled>
                    <div class="input-group-append">
                        <span class="input-group-text">ч</span>
                    </div>
                </div>
            </div>
            <div class="form-group col">
                <label for="timeMinuteInput">&nbsp;</label>
                <div class="input-group" style="width: 83px">
                    <input id="timeMinuteInput" class="form-control disabled" type="number" name="timeMinute" value="25"
                           onkeyup="pace()" disabled>
                    <div class="input-group-append">
                        <span class="input-group-text">м</span>
                    </div>
                </div>
            </div>
            <div class="form-group col">
                <label for="timeSecondInput">&nbsp;</label>
                <div class="input-group" style="width: 83px">
                    <input id="timeSecondInput" class="form-control disabled" type="number" name="timeSecond" value="39"
                           onkeyup="pace()" disabled>
                    <div class="input-group-append">
                        <span class="input-group-text">с</span>
                    </div>
                </div>
            </div>
        </div>
        <br/>
        <div class="form-row d-inline-flex">
            <div class="form-group col">
                <label for="paceMinuteInput">Темп</label>
                <div class="input-group" style="width: 83px">
                    <input id="paceMinuteInput" class="form-control disabled" type="number" name="paceMinute" value="4"
                           onkeyup="time()" disabled>
                    <div class="input-group-append">
                        <span class="input-group-text">м</span>
                    </div>
                </div>
            </div>
            <div class="form-group col">
                <label for="paceSecondInput">&nbsp;</label>
                <div class="input-group" style="width: 83px">
                    <input id="paceSecondInput" class="form-control disabled" type="number" name="paceSecond" value="4"
                           onkeyup="time()" disabled>
                    <div class="input-group-append">
                        <span class="input-group-text">с</span>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

</body>
<script>
    // grid
    let slider = $("#slider")

    slider.ionRangeSlider({
        skin: "round",
        min: 0,
        grid: true,
        grid_snap: false,
        grid_num: 5,
        from: 21097,
        max: 160934,
        step: 1,
        disable: true,
        onChange: function () {
            refreshDist();
        }
    });

    let instance = slider.data("ionRangeSlider");

    // distance input
    let distInput = document.getElementById("distInput");
    distInput.addEventListener('input', () => {
        instance.update({
            from: distInput.value
        });
    });

    function refreshDist() {
        distRangeChange();
        pace();
    }

    let pace = function () {
        let distInputValue = distInput.value

        let dist = Number(distInputValue)
        if (dist === 0) {
            return
        }

        let timeHourValue = document.getElementById("timeHourInput").value;
        let timeMinuteValue = document.getElementById("timeMinuteInput").value;
        let timeSecondValue = document.getElementById("timeSecondInput").value;

        try {
            const result = calcPace(dist, timeHourValue, timeMinuteValue, timeSecondValue);

            let jsonResult = JSON.parse(result)
            if (jsonResult["error"] != null) {
                console.error("calcPace execution error", jsonResult["error"])
                return
            }

            let minute = jsonResult["minute"]
            let second = jsonResult["second"]

            document.getElementById("paceMinuteInput").value = minute
            document.getElementById("paceSecondInput").value = second

            console.log("success update pace")
        } catch (e) {
            // инструкции для обработки ошибок
            alert(e); // передать объект исключения обработчику ошибок
        }
    };

    let time = function () {
        let result = calcTime();
        console.debug("calcTime result: ", result)

        let jsonResult = JSON.parse(result)
        if (jsonResult["error"] != null) {
            console.error("calcPace execution error", jsonResult["error"])
            return
        }

        console.log("success update time")
    };

    function distRangeChange() {
        let slider = document.getElementById("slider").value;
        let distInput = document.getElementById("distInput");

        distInput.value = slider;
    }

    // distance buttons
    const distButtons = ['b1km', 'b3km', 'b5km', 'b10km', 'b21km', 'b42km', 'b50km', 'b50mile', 'b100km', 'b100mile'];

    distButtons.forEach(element => {
        let button = document.getElementById(element);

        button.addEventListener("click", function () {
            instance.update({
                from: button.value
            });
            refreshDist();
        });
    });
</script>

</html>
