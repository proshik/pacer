<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Калькулятор бегового темпа и финишного времени: задайте дистанцию и темп — получите время, или наоборот.">
    <meta name="theme-color" content="#1f6feb">
    <title>Pacer</title>

    <script src="wasm_exec.js"></script>

    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --text: #1a2533;
            --muted: #677788;
            --accent: #1f6feb;
            --accent-hover: #1557b0;
            --accent-bright: #2f8dff;
            --accent-bright-hover: #1f78f0;
            --border: #dce4ef;
            --field-bg: #f5f8fd;
            --field-text: #4b5f76;
            --danger: #c62828;
            --shadow: 0 16px 40px rgba(18, 34, 65, 0.08);
            --focus-ring: 0 0 0 0.2rem rgba(31, 111, 235, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(180deg, #f7f9fd 0%, #eef2f8 100%);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 16px;
            line-height: 1.5;
            min-height: 100dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 0;
        }

        .app-shell {
            width: min(980px, calc(100vw - 32px));
            margin: 0 auto;
        }

        .app-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 24px;
        }

        .headline {
            margin-bottom: 20px;
        }

        .headline h1 {
            margin: 0 0 6px;
            font-size: 2rem;
            font-weight: 700;
        }

        .headline p {
            margin: 0;
            color: var(--muted);
        }

        .section-title {
            margin: 14px 0 10px;
            font-size: 0.85rem;
            letter-spacing: 0.06em;
            color: var(--muted);
            text-transform: uppercase;
        }

        /* ---------- дистанция ---------- */

        .field-group {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 8px;
            align-items: flex-start;
        }

        .field-box {
            min-width: 110px;
            flex: 1 1 110px;
        }

        .field-box.dist-box {
            flex: 0 1 210px;
            max-width: 210px;
        }

        .field-box.slider-box {
            flex: 1 1 280px;
            min-width: 240px;
        }

        .compact-field {
            flex: 0 0 auto;
            min-width: 0;
        }

        label {
            display: inline-block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
        }

        .input-row {
            display: flex;
            align-items: stretch;
            width: 100%;
        }

        .control {
            font: inherit;
            color: var(--text);
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 0.25rem;
            padding: 6px 10px;
            min-width: 0;
        }

        .control:focus {
            outline: none;
            border-color: #8ab4ff;
            box-shadow: var(--focus-ring);
        }

        .control.input-error {
            border-color: var(--danger);
        }

        .input-row .control {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            flex: 1 1 auto;
        }

        .unit {
            display: inline-flex;
            align-items: center;
            padding: 0 10px;
            background: var(--field-bg);
            border: 1px solid var(--border);
            border-left: 0;
            border-radius: 0 0.25rem 0.25rem 0;
            color: var(--field-text);
            font-weight: 600;
            white-space: nowrap;
        }

        .numeric-input {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .hint {
            color: var(--muted);
            margin: 4px 0 0;
            font-size: 0.88rem;
        }

        /* ---------- нативный слайдер вместо ion-rangeslider ---------- */

        .slider-input {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 22px;
            margin: 6px 0 0;
            background: transparent;
            cursor: pointer;
        }

        .slider-input:focus {
            outline: none;
        }

        .slider-input::-webkit-slider-runnable-track {
            height: 6px;
            border-radius: 999px;
            background: #dfe7f4;
        }

        .slider-input::-moz-range-track {
            height: 6px;
            border-radius: 999px;
            background: #dfe7f4;
        }

        .slider-input::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            margin-top: -7px;
            border: 0;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 2px 6px rgba(18, 34, 65, 0.28);
        }

        .slider-input::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border: 0;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 2px 6px rgba(18, 34, 65, 0.28);
        }

        .slider-input:focus-visible::-webkit-slider-thumb {
            box-shadow: var(--focus-ring), 0 2px 6px rgba(18, 34, 65, 0.28);
        }

        .slider-input:focus-visible::-moz-range-thumb {
            box-shadow: var(--focus-ring), 0 2px 6px rgba(18, 34, 65, 0.28);
        }

        .slider-input:disabled {
            cursor: not-allowed;
            opacity: 0.55;
        }

        .slider-scale {
            display: flex;
            justify-content: space-between;
            margin-top: 2px;
            font-size: 0.78rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .slider-readout {
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* ---------- пресеты дистанций ---------- */

        .distance-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .preset-btn {
            font: inherit;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 5px 12px;
            border-radius: 999px;
            border: 1px solid var(--accent);
            background-color: var(--accent);
            color: #fff;
            cursor: pointer;
            transition: background-color 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
        }

        .preset-btn:hover,
        .preset-btn:focus {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .preset-btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 0.2rem rgba(47, 141, 255, 0.35);
        }

        .preset-btn.active-preset,
        .preset-btn.active-preset:hover,
        .preset-btn.active-preset:focus {
            background-color: var(--accent-bright);
            border-color: var(--accent-bright);
            box-shadow: 0 0 0 0.2rem rgba(47, 141, 255, 0.35), 0 6px 16px rgba(31, 120, 240, 0.24);
        }

        .preset-btn.active-preset:active {
            background-color: var(--accent-bright-hover);
            border-color: var(--accent-bright-hover);
        }

        .preset-btn:disabled {
            cursor: not-allowed;
        }

        /* ---------- спиннеры ---------- */

        .spin-control {
            display: inline-flex;
            align-items: stretch;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 1px 0 rgba(18, 34, 65, 0.03);
            width: max-content;
        }

        .spin-control:focus-within {
            border-color: #8ab4ff;
            box-shadow: var(--focus-ring);
        }

        .spin-btn {
            font: inherit;
            border: 0;
            background: #f3f7ff;
            color: #2a4365;
            font-weight: 700;
            width: 30px;
            min-width: 30px;
            cursor: pointer;
            user-select: none;
        }

        .spin-btn:hover,
        .spin-btn:focus {
            background: #e7f0ff;
            outline: none;
        }

        .spin-btn:focus-visible {
            box-shadow: inset 0 0 0 2px var(--accent);
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spin-control .numeric-input {
            border: 0;
            border-radius: 0;
            box-shadow: none;
            touch-action: none;
            background: #fff;
        }

        .spin-control .numeric-input:focus {
            box-shadow: none;
        }

        .numeric-input-3 {
            width: 7ch;
            min-width: 7ch;
        }

        .numeric-input-2 {
            width: 6ch;
            min-width: 6ch;
        }

        .spin-unit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
            min-width: 32px;
            background: var(--field-bg);
            color: var(--field-text);
            border-left: 1px solid var(--border);
            font-weight: 600;
        }

        .error-text {
            color: var(--danger);
            font-size: 0.9rem;
            margin: 10px 0 0;
            min-height: 24px;
        }

        @media (max-width: 768px) {
            body {
                display: block;
                padding: 12px 0 20px;
            }

            .app-shell {
                width: calc(100vw - 16px);
            }

            .app-card {
                padding: 16px;
                border-radius: 14px;
            }

            .field-box,
            .field-box.dist-box,
            .field-box.slider-box {
                min-width: 0;
                flex: 1 1 100%;
                max-width: none;
            }

            .compact-field {
                flex: 1 1 calc(50% - 7px);
            }

            .spin-control {
                width: 100%;
            }

            .numeric-input-3,
            .numeric-input-2 {
                width: 100%;
                min-width: 0;
            }

            .spin-btn {
                width: 36px;
                min-width: 36px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                transition: none !important;
            }
        }
    </style>

    <script>
        const wasmFileName = "json.wasm";
        const distButtonIDs = ["b1km", "b3km", "b5km", "b10km", "b21km", "b42km", "b50km", "b50mile", "b100km", "b100mile"];
        const spinInputIDs = ["timeHourInput", "timeMinuteInput", "timeSecondInput", "paceMinuteInput", "paceSecondInput"];

        function setError(message) {
            document.getElementById("errorMessage").textContent = message || "";
        }

        function clearInputErrors() {
            document.querySelectorAll("input").forEach((input) => {
                input.classList.remove("input-error");
            });
        }

        function markInvalid(ids) {
            ids.forEach((id) => {
                const input = document.getElementById(id);
                if (input) {
                    input.classList.add("input-error");
                }
            });
        }

        function setInputsDisabled(disabled) {
            document.querySelectorAll("input, button").forEach((element) => {
                element.disabled = disabled;
            });
        }

        function parseNonNegativeInt(value) {
            if (value === null || value === undefined || value === "") {
                return {ok: false, parsed: 0};
            }

            const parsed = Number(value);
            if (!Number.isInteger(parsed) || parsed < 0) {
                return {ok: false, parsed: 0};
            }

            return {ok: true, parsed};
        }

        function getSlider() {
            return document.getElementById("slider");
        }

        function formatMeters(meters) {
            return meters.toLocaleString("ru-RU");
        }

        function updateSliderReadout(value) {
            document.getElementById("sliderReadout").textContent = formatMeters(value) + " м";
        }

        // distInput -> слайдер
        function syncDistanceToSlider() {
            const slider = getSlider();
            const distValue = Number(document.getElementById("distInput").value);

            if (Number.isInteger(distValue) && distValue >= 0) {
                const clamped = clamp(distValue, Number(slider.min), Number(slider.max));
                slider.value = clamped;
                updateSliderReadout(clamped);
                updatePresetHighlight(distValue);
                return;
            }

            updatePresetHighlight(null);
        }

        // слайдер -> distInput
        function syncDistanceFromSlider() {
            const sliderValue = Number(getSlider().value);
            if (!Number.isFinite(sliderValue)) {
                updatePresetHighlight(null);
                return;
            }

            document.getElementById("distInput").value = sliderValue;
            updateSliderReadout(sliderValue);
            updatePresetHighlight(sliderValue);
        }

        function updatePresetHighlight(distanceValue) {
            const selectedValue = Number(distanceValue);
            distButtonIDs.forEach((id) => {
                const button = document.getElementById(id);
                if (!button) {
                    return;
                }

                button.classList.toggle("active-preset", Number(button.value) === selectedValue);
            });
        }

        function validateInputsForPace() {
            const distCheck = parseNonNegativeInt(document.getElementById("distInput").value);
            const hourCheck = parseNonNegativeInt(document.getElementById("timeHourInput").value);
            const minuteCheck = parseNonNegativeInt(document.getElementById("timeMinuteInput").value);
            const secondCheck = parseNonNegativeInt(document.getElementById("timeSecondInput").value);

            const invalidIDs = [];
            if (!distCheck.ok || distCheck.parsed <= 0) invalidIDs.push("distInput");
            if (!hourCheck.ok) invalidIDs.push("timeHourInput");
            if (!minuteCheck.ok || minuteCheck.parsed > 59) invalidIDs.push("timeMinuteInput");
            if (!secondCheck.ok || secondCheck.parsed > 59) invalidIDs.push("timeSecondInput");

            return {ok: invalidIDs.length === 0, invalidIDs, dist: distCheck.parsed};
        }

        function validateInputsForTime() {
            const distCheck = parseNonNegativeInt(document.getElementById("distInput").value);
            const paceMinuteCheck = parseNonNegativeInt(document.getElementById("paceMinuteInput").value);
            const paceSecondCheck = parseNonNegativeInt(document.getElementById("paceSecondInput").value);

            const invalidIDs = [];
            if (!distCheck.ok || distCheck.parsed <= 0) invalidIDs.push("distInput");
            if (!paceMinuteCheck.ok) invalidIDs.push("paceMinuteInput");
            if (!paceSecondCheck.ok || paceSecondCheck.parsed > 59) invalidIDs.push("paceSecondInput");
            if (paceMinuteCheck.ok && paceSecondCheck.ok && paceMinuteCheck.parsed === 0 && paceSecondCheck.parsed === 0) {
                invalidIDs.push("paceMinuteInput", "paceSecondInput");
            }

            return {ok: invalidIDs.length === 0, invalidIDs};
        }

        function pace() {
            clearInputErrors();
            setError("");

            const validation = validateInputsForPace();
            if (!validation.ok) {
                markInvalid(validation.invalidIDs);
                setError("Проверьте дистанцию и формат времени (мин/сек: 0..59).");
                return;
            }

            const hours = document.getElementById("timeHourInput").value;
            const minutes = document.getElementById("timeMinuteInput").value;
            const seconds = document.getElementById("timeSecondInput").value;

            try {
                const jsonResult = JSON.parse(calcPace(validation.dist, hours, minutes, seconds));
                if (jsonResult.error) {
                    setError(jsonResult.error);
                    return;
                }

                document.getElementById("paceMinuteInput").value = jsonResult.minute;
                document.getElementById("paceSecondInput").value = jsonResult.second;
            } catch (error) {
                setError("Ошибка вычисления темпа.");
                console.error(error);
            }
        }

        function time() {
            clearInputErrors();
            setError("");

            const validation = validateInputsForTime();
            if (!validation.ok) {
                markInvalid(validation.invalidIDs);
                setError("Проверьте дистанцию и темп (секунды: 0..59, темп не может быть 0:00).");
                return;
            }

            try {
                // calcTime() читает distInput/paceMinuteInput/paceSecondInput из DOM
                // и сам записывает результат в поля времени.
                const jsonResult = JSON.parse(calcTime());
                if (jsonResult.error) {
                    setError(jsonResult.error);
                }
            } catch (error) {
                setError("Ошибка вычисления времени.");
                console.error(error);
            }
        }

        function attachDistanceButtons() {
            distButtonIDs.forEach((id) => {
                const button = document.getElementById(id);
                button.addEventListener("click", function () {
                    getSlider().value = button.value;
                    syncDistanceFromSlider();
                    pace();
                });
            });
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function getInputBounds(input) {
            const min = Number(input.min || 0);
            const max = input.max === "" ? Number.MAX_SAFE_INTEGER : Number(input.max);
            const step = Number(input.step || 1);

            return {
                min: Number.isFinite(min) ? min : 0,
                max: Number.isFinite(max) ? max : Number.MAX_SAFE_INTEGER,
                step: Number.isFinite(step) && step > 0 ? step : 1
            };
        }

        function applySpinValue(input, nextValue) {
            const bounds = getInputBounds(input);
            input.value = clamp(Math.round(nextValue), bounds.min, bounds.max);
            input.dispatchEvent(new Event("input", {bubbles: true}));
        }

        function changeSpinValue(input, direction) {
            if (input.disabled) {
                return;
            }

            const bounds = getInputBounds(input);
            const current = Number(input.value || 0);
            const safeCurrent = Number.isFinite(current) ? current : bounds.min;
            applySpinValue(input, safeCurrent + direction * bounds.step);
        }

        function startPressRepeat(button, input, direction) {
            let repeatTimer = null;
            let repeatInterval = null;

            const clearRepeat = () => {
                if (repeatTimer) {
                    clearTimeout(repeatTimer);
                    repeatTimer = null;
                }
                if (repeatInterval) {
                    clearInterval(repeatInterval);
                    repeatInterval = null;
                }
            };

            const startRepeat = () => {
                changeSpinValue(input, direction);
                repeatTimer = setTimeout(() => {
                    repeatInterval = setInterval(() => changeSpinValue(input, direction), 60);
                }, 260);
            };

            button.addEventListener("pointerdown", (event) => {
                if (button.disabled) {
                    return;
                }
                event.preventDefault();
                startRepeat();
            });
            button.addEventListener("pointerup", clearRepeat);
            button.addEventListener("pointerleave", clearRepeat);
            button.addEventListener("pointercancel", clearRepeat);
        }

        function attachSpinInput(inputId) {
            const input = document.getElementById(inputId);
            const container = input.closest(".spin-control");

            startPressRepeat(container.querySelector(".spin-dec"), input, -1);
            startPressRepeat(container.querySelector(".spin-inc"), input, 1);

            input.addEventListener("wheel", (event) => {
                if (input.disabled) {
                    return;
                }
                event.preventDefault();
                changeSpinValue(input, event.deltaY < 0 ? 1 : -1);
            }, {passive: false});

            let dragState = null;
            input.addEventListener("pointerdown", (event) => {
                if (input.disabled) {
                    return;
                }

                dragState = {
                    startY: event.clientY,
                    startValue: Number(input.value || 0)
                };
                input.setPointerCapture(event.pointerId);
            });

            input.addEventListener("pointermove", (event) => {
                if (!dragState || input.disabled) {
                    return;
                }

                event.preventDefault();
                const bounds = getInputBounds(input);
                const steps = Math.trunc((dragState.startY - event.clientY) / 10);
                const baseValue = Number.isFinite(dragState.startValue) ? dragState.startValue : bounds.min;
                applySpinValue(input, baseValue + steps * bounds.step);
            });

            const stopDrag = (event) => {
                if (!dragState) {
                    return;
                }

                dragState = null;
                if (event && event.pointerId !== undefined && input.hasPointerCapture(event.pointerId)) {
                    input.releasePointerCapture(event.pointerId);
                }
            };

            input.addEventListener("pointerup", stopDrag);
            input.addEventListener("pointercancel", stopDrag);
            input.addEventListener("pointerleave", stopDrag);
        }

        function attachSpinControls() {
            spinInputIDs.forEach(attachSpinInput);
        }

        function loadWASM() {
            if (!WebAssembly.instantiateStreaming) {
                WebAssembly.instantiateStreaming = async (resp, importObject) => {
                    const source = await (await resp).arrayBuffer();
                    return await WebAssembly.instantiate(source, importObject);
                };
            }

            const go = new Go();
            WebAssembly.instantiateStreaming(fetch(wasmFileName), go.importObject)
                .then((results) => {
                    go.run(results.instance);
                    setInputsDisabled(false);
                    pace();
                })
                .catch((error) => {
                    setError("Не удалось загрузить WebAssembly.");
                    console.error(error);
                });
        }

        document.addEventListener("DOMContentLoaded", function () {
            const slider = getSlider();

            slider.addEventListener("input", function () {
                syncDistanceFromSlider();
                pace();
            });

            attachDistanceButtons();
            attachSpinControls();

            document.getElementById("distInput").addEventListener("input", function () {
                syncDistanceToSlider();
                pace();
            });
            document.getElementById("timeHourInput").addEventListener("input", pace);
            document.getElementById("timeMinuteInput").addEventListener("input", pace);
            document.getElementById("timeSecondInput").addEventListener("input", pace);
            document.getElementById("paceMinuteInput").addEventListener("input", time);
            document.getElementById("paceSecondInput").addEventListener("input", time);

            setInputsDisabled(true);

            const initialDistance = Number(document.getElementById("distInput").value);
            slider.value = initialDistance;
            updateSliderReadout(initialDistance);
            updatePresetHighlight(initialDistance);

            loadWASM();
        });
    </script>
</head>
<body>
<div class="app-shell">
    <div class="app-card">
        <div class="headline">
            <h1>Pacer</h1>
            <p>Калькулятор темпа и финишного времени для беговых дистанций.</p>
        </div>

        <div class="section-title">Дистанция</div>
        <div class="field-group">
            <div class="field-box dist-box">
                <label for="distInput">Дистанция</label>
                <div class="input-row">
                    <input id="distInput" class="control numeric-input" type="number" name="distInput"
                           value="21097" min="0" step="1" inputmode="numeric" disabled>
                    <span class="unit">метров</span>
                </div>
                <p class="hint">Можно задать вручную или выбрать пресет.</p>
            </div>
            <div class="field-box slider-box">
                <label for="slider">Выбор дистанции — <span id="sliderReadout" class="slider-readout">21 097 м</span></label>
                <input type="range" class="slider-input" id="slider" min="0" max="200000" step="1" value="21097"
                       aria-describedby="sliderReadout" disabled>
                <div class="slider-scale" aria-hidden="true">
                    <span>0</span>
                    <span>50 км</span>
                    <span>100 км</span>
                    <span>150 км</span>
                    <span>200 км</span>
                </div>
            </div>
        </div>

        <div class="distance-buttons">
            <button type="button" id="b1km" value="1000" class="preset-btn" disabled>1 км</button>
            <button type="button" id="b3km" value="3000" class="preset-btn" disabled>3 км</button>
            <button type="button" id="b5km" value="5000" class="preset-btn" disabled>5 км</button>
            <button type="button" id="b10km" value="10000" class="preset-btn" disabled>10 км</button>
            <button type="button" id="b21km" value="21097" class="preset-btn" disabled>Полумарафон</button>
            <button type="button" id="b42km" value="42195" class="preset-btn" disabled>Марафон</button>
            <button type="button" id="b50km" value="50000" class="preset-btn" disabled>50 км</button>
            <button type="button" id="b50mile" value="80467" class="preset-btn" disabled>50 миль</button>
            <button type="button" id="b100km" value="100000" class="preset-btn" disabled>100 км</button>
            <button type="button" id="b100mile" value="160934" class="preset-btn" disabled>100 миль</button>
        </div>

        <div class="section-title">Время</div>
        <div class="field-group">
            <div class="field-box compact-field">
                <label for="timeHourInput">Часы</label>
                <div class="spin-control">
                    <button type="button" class="spin-btn spin-dec" aria-label="Уменьшить часы" disabled>-</button>
                    <input id="timeHourInput" class="control numeric-input numeric-input-3" type="number" name="timeHour"
                           value="1" min="0" max="999" inputmode="numeric" disabled>
                    <button type="button" class="spin-btn spin-inc" aria-label="Увеличить часы" disabled>+</button>
                    <span class="spin-unit">ч</span>
                </div>
            </div>
            <div class="field-box compact-field">
                <label for="timeMinuteInput">Минуты</label>
                <div class="spin-control">
                    <button type="button" class="spin-btn spin-dec" aria-label="Уменьшить минуты" disabled>-</button>
                    <input id="timeMinuteInput" class="control numeric-input numeric-input-2" type="number" name="timeMinute"
                           value="25" min="0" max="59" inputmode="numeric" disabled>
                    <button type="button" class="spin-btn spin-inc" aria-label="Увеличить минуты" disabled>+</button>
                    <span class="spin-unit">м</span>
                </div>
            </div>
            <div class="field-box compact-field">
                <label for="timeSecondInput">Секунды</label>
                <div class="spin-control">
                    <button type="button" class="spin-btn spin-dec" aria-label="Уменьшить секунды" disabled>-</button>
                    <input id="timeSecondInput" class="control numeric-input numeric-input-2" type="number" name="timeSecond"
                           value="39" min="0" max="59" inputmode="numeric" disabled>
                    <button type="button" class="spin-btn spin-inc" aria-label="Увеличить секунды" disabled>+</button>
                    <span class="spin-unit">с</span>
                </div>
            </div>
        </div>

        <div class="section-title">Темп</div>
        <div class="field-group">
            <div class="field-box compact-field">
                <label for="paceMinuteInput">Минуты</label>
                <div class="spin-control">
                    <button type="button" class="spin-btn spin-dec" aria-label="Уменьшить минуты темпа" disabled>-</button>
                    <input id="paceMinuteInput" class="control numeric-input numeric-input-3" type="number" name="paceMinute"
                           value="4" min="0" max="999" inputmode="numeric" disabled>
                    <button type="button" class="spin-btn spin-inc" aria-label="Увеличить минуты темпа" disabled>+</button>
                    <span class="spin-unit">м</span>
                </div>
            </div>
            <div class="field-box compact-field">
                <label for="paceSecondInput">Секунды</label>
                <div class="spin-control">
                    <button type="button" class="spin-btn spin-dec" aria-label="Уменьшить секунды темпа" disabled>-</button>
                    <input id="paceSecondInput" class="control numeric-input numeric-input-2" type="number" name="paceSecond"
                           value="4" min="0" max="59" inputmode="numeric" disabled>
                    <button type="button" class="spin-btn spin-inc" aria-label="Увеличить секунды темпа" disabled>+</button>
                    <span class="spin-unit">с</span>
                </div>
            </div>
        </div>

        <p id="errorMessage" class="error-text" role="status" aria-live="polite"></p>
    </div>
</div>
</body>
</html>
