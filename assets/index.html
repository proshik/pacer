<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Pacer</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/ion-rangeslider/2.3.1/css/ion.rangeSlider.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ion-rangeslider/2.3.1/js/ion.rangeSlider.min.js"></script>
    <script src="wasm_exec.js"></script>

    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --text: #1a2533;
            --muted: #677788;
            --accent: #1f6feb;
            --accent-hover: #1557b0;
            --accent-bright: #2f8dff;
            --accent-bright-hover: #1f78f0;
            --border: #dce4ef;
            --danger: #c62828;
            --shadow: 0 16px 40px rgba(18, 34, 65, 0.08);
        }

        body {
            background: linear-gradient(180deg, #f7f9fd 0%, #eef2f8 100%);
            color: var(--text);
            min-height: 100dvh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 0;
        }

        .app-shell {
            width: min(980px, calc(100vw - 32px));
            margin: 0 auto;
        }

        .app-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 24px;
        }

        .headline {
            margin-bottom: 20px;
        }

        .headline h1 {
            margin-bottom: 6px;
            font-size: 2rem;
            font-weight: 700;
        }

        .headline p {
            margin: 0;
            color: var(--muted);
        }

        .section-title {
            margin-top: 14px;
            margin-bottom: 10px;
            font-size: 0.85rem;
            letter-spacing: 0.06em;
            color: var(--muted);
            text-transform: uppercase;
        }

        .distance-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .distance-buttons .btn {
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 5px 12px;
            transition: background-color 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
        }

        .distance-buttons .btn.disabled,
        .distance-buttons .btn:not(:disabled) {
            opacity: 1;
        }

        .distance-buttons .btn.disabled {
            pointer-events: auto;
        }

        .btn-primary {
            background-color: var(--accent);
            border-color: var(--accent);
        }

        .btn-primary:hover, .btn-primary:focus {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .distance-buttons .btn.active-preset,
        .distance-buttons .btn.active-preset:hover,
        .distance-buttons .btn.active-preset:focus {
            background-color: var(--accent-bright);
            border-color: var(--accent-bright);
            color: #fff;
            box-shadow: 0 0 0 0.2rem rgba(47, 141, 255, 0.35), 0 6px 16px rgba(31, 120, 240, 0.24);
        }

        .distance-buttons .btn.active-preset:active {
            background-color: var(--accent-bright-hover);
            border-color: var(--accent-bright-hover);
        }

        .distance-buttons .btn:focus,
        .distance-buttons .btn:focus-visible {
            box-shadow: 0 0 0 0.2rem rgba(47, 141, 255, 0.35);
        }

        .field-group {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 8px;
        }

        .field-box {
            min-width: 110px;
            flex: 1 1 110px;
        }

        .compact-field {
            flex: 0 0 auto;
            min-width: 0;
        }

        .compact-field .input-group {
            width: max-content;
        }

        .field-box label {
            font-weight: 600;
            margin-bottom: 6px;
            color: #334155;
            margin-right: 10px;
        }

        .input-group-text {
            background: #f5f8fd;
            border-color: var(--border);
            color: #4b5f76;
            font-weight: 600;
        }

        .spin-control {
            display: inline-flex;
            align-items: stretch;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 1px 0 rgba(18, 34, 65, 0.03);
        }

        .spin-btn {
            border: 0;
            background: #f3f7ff;
            color: #2a4365;
            font-weight: 700;
            width: 30px;
            min-width: 30px;
            cursor: pointer;
            user-select: none;
        }

        .spin-btn:hover,
        .spin-btn:focus {
            background: #e7f0ff;
            outline: none;
        }

        .spin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spin-unit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 10px;
            min-width: 32px;
            background: #f5f8fd;
            color: #4b5f76;
            border-left: 1px solid var(--border);
            font-weight: 600;
        }

        .form-control {
            border-color: var(--border);
        }

        .form-control:focus {
            border-color: #8ab4ff;
            box-shadow: 0 0 0 0.2rem rgba(31, 111, 235, 0.2);
        }

        .form-control.input-error {
            border-color: var(--danger);
        }

        .numeric-input {
            text-align: right;
            font-variant-numeric: tabular-nums;
            border: 0;
            border-radius: 0;
            box-shadow: none;
            touch-action: none;
        }

        #distInput {
            border: 1px solid var(--border);
            border-radius: 0.25rem;
        }

        .numeric-input-3 {
            width: 7ch;
            min-width: 7ch;
        }

        .numeric-input-2 {
            width: 6ch;
            min-width: 6ch;
        }

        .numeric-input:focus {
            box-shadow: none;
        }

        .spin-control:focus-within {
            border-color: #8ab4ff;
            box-shadow: 0 0 0 0.2rem rgba(31, 111, 235, 0.2);
        }

        .hint {
            color: var(--muted);
            margin-top: 4px;
            margin-bottom: 0;
            font-size: 0.88rem;
        }

        .error-text {
            color: var(--danger);
            font-size: 0.9rem;
            margin-top: 10px;
            margin-bottom: 0;
            min-height: 24px;
        }

        @media (max-width: 768px) {
            body {
                display: block;
                padding: 12px 0 20px;
            }

            .app-shell {
                width: calc(100vw - 16px);
            }

            .app-card {
                padding: 16px;
                border-radius: 14px;
            }

            .field-box {
                min-width: 0;
                flex: 1 1 100%;
            }

            .field-box[style*="max-width"] {
                max-width: 100% !important;
            }

            .compact-field {
                flex: 1 1 calc(50% - 7px);
            }

            .compact-field .input-group {
                width: 100%;
            }

            .numeric-input-3 {
                width: 100%;
                min-width: 0;
            }

            .numeric-input-2 {
                width: 100%;
                min-width: 0;
            }

            .spin-control {
                width: 100%;
            }

            .spin-btn {
                width: 36px;
                min-width: 36px;
            }
        }
    </style>

    <script>
        const wasmFileName = "json.wasm";
        const distButtonIDs = ["b1km", "b3km", "b5km", "b10km", "b21km", "b42km", "b50km", "b50mile", "b100km", "b100mile"];
        let sliderInstance;

        function setError(message) {
            const errorMessage = document.getElementById("errorMessage");
            errorMessage.textContent = message || "";
        }

        function clearInputErrors() {
            document.querySelectorAll("input").forEach((input) => {
                input.classList.remove("input-error");
            });
        }

        function markInvalid(ids) {
            ids.forEach((id) => {
                const input = document.getElementById(id);
                if (input) {
                    input.classList.add("input-error");
                }
            });
        }

        function setInputsDisabled(disabled) {
            document.querySelectorAll(".disabled").forEach((element) => {
                element.disabled = disabled;
            });

            distButtonIDs.forEach((id) => {
                const button = document.getElementById(id);
                if (button) {
                    button.disabled = disabled;
                }
            });

            if (sliderInstance) {
                sliderInstance.update({disable: disabled});
            }
        }

        function parseNonNegativeInt(value) {
            if (value === null || value === undefined || value === "") {
                return {ok: false, parsed: 0};
            }

            const parsed = Number(value);
            if (!Number.isInteger(parsed) || parsed < 0) {
                return {ok: false, parsed: 0};
            }

            return {ok: true, parsed};
        }

        function syncDistanceToSlider() {
            const distInput = document.getElementById("distInput");
            const distValue = Number(distInput.value);
            if (Number.isInteger(distValue) && distValue >= 0) {
                sliderInstance.update({from: distValue});
                updatePresetHighlight(distValue);
                return;
            }

            updatePresetHighlight(null);
        }

        function getSliderDistanceValue() {
            if (sliderInstance && sliderInstance.result && Number.isFinite(sliderInstance.result.from)) {
                return sliderInstance.result.from;
            }

            const raw = (document.getElementById("slider").value || "").replace(/[^\d]/g, "");
            if (raw === "") {
                return null;
            }

            const parsed = Number(raw);
            return Number.isFinite(parsed) ? parsed : null;
        }

        function syncDistanceFromSlider() {
            const sliderValue = getSliderDistanceValue();
            if (sliderValue === null) {
                updatePresetHighlight(null);
                return;
            }

            document.getElementById("distInput").value = sliderValue;
            updatePresetHighlight(sliderValue);
        }

        function updatePresetHighlight(distanceValue) {
            const selectedValue = Number(distanceValue);
            distButtonIDs.forEach((id) => {
                const button = document.getElementById(id);
                if (!button) {
                    return;
                }

                if (Number(button.value) === selectedValue) {
                    button.classList.add("active-preset");
                } else {
                    button.classList.remove("active-preset");
                }
            });
        }

        function validateInputsForPace() {
            const distCheck = parseNonNegativeInt(document.getElementById("distInput").value);
            const hourCheck = parseNonNegativeInt(document.getElementById("timeHourInput").value);
            const minuteCheck = parseNonNegativeInt(document.getElementById("timeMinuteInput").value);
            const secondCheck = parseNonNegativeInt(document.getElementById("timeSecondInput").value);

            const invalidIDs = [];
            if (!distCheck.ok || distCheck.parsed <= 0) invalidIDs.push("distInput");
            if (!hourCheck.ok) invalidIDs.push("timeHourInput");
            if (!minuteCheck.ok || minuteCheck.parsed > 59) invalidIDs.push("timeMinuteInput");
            if (!secondCheck.ok || secondCheck.parsed > 59) invalidIDs.push("timeSecondInput");

            return {ok: invalidIDs.length === 0, invalidIDs, dist: distCheck.parsed};
        }

        function validateInputsForTime() {
            const distCheck = parseNonNegativeInt(document.getElementById("distInput").value);
            const paceMinuteCheck = parseNonNegativeInt(document.getElementById("paceMinuteInput").value);
            const paceSecondCheck = parseNonNegativeInt(document.getElementById("paceSecondInput").value);

            const invalidIDs = [];
            if (!distCheck.ok || distCheck.parsed <= 0) invalidIDs.push("distInput");
            if (!paceMinuteCheck.ok) invalidIDs.push("paceMinuteInput");
            if (!paceSecondCheck.ok || paceSecondCheck.parsed > 59) invalidIDs.push("paceSecondInput");
            if (paceMinuteCheck.ok && paceSecondCheck.ok && paceMinuteCheck.parsed === 0 && paceSecondCheck.parsed === 0) {
                invalidIDs.push("paceMinuteInput", "paceSecondInput");
            }

            return {ok: invalidIDs.length === 0, invalidIDs};
        }

        function pace() {
            clearInputErrors();
            setError("");

            const validation = validateInputsForPace();
            if (!validation.ok) {
                markInvalid(validation.invalidIDs);
                setError("Проверьте дистанцию и формат времени (мин/сек: 0..59).");
                return;
            }

            const hours = document.getElementById("timeHourInput").value;
            const minutes = document.getElementById("timeMinuteInput").value;
            const seconds = document.getElementById("timeSecondInput").value;

            try {
                const result = calcPace(validation.dist, hours, minutes, seconds);
                const jsonResult = JSON.parse(result);
                if (jsonResult.error) {
                    setError(jsonResult.error);
                    return;
                }

                document.getElementById("paceMinuteInput").value = jsonResult.minute;
                document.getElementById("paceSecondInput").value = jsonResult.second;
            } catch (error) {
                setError("Ошибка вычисления темпа.");
                console.error(error);
            }
        }

        function time() {
            clearInputErrors();
            setError("");

            const validation = validateInputsForTime();
            if (!validation.ok) {
                markInvalid(validation.invalidIDs);
                setError("Проверьте дистанцию и темп (секунды: 0..59, темп не может быть 0:00).");
                return;
            }

            try {
                const result = calcTime();
                const jsonResult = JSON.parse(result);
                if (jsonResult.error) {
                    setError(jsonResult.error);
                    return;
                }
            } catch (error) {
                setError("Ошибка вычисления времени.");
                console.error(error);
            }
        }

        function attachDistanceButtons() {
            distButtonIDs.forEach((id) => {
                const button = document.getElementById(id);
                button.addEventListener("click", function () {
                    const selectedDistance = Number(button.value);
                    sliderInstance.update({from: selectedDistance});
                    syncDistanceFromSlider();
                    updatePresetHighlight(selectedDistance);
                    pace();
                });
            });
        }

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function getInputBounds(input) {
            const min = Number(input.min || 0);
            const max = input.max === "" ? Number.MAX_SAFE_INTEGER : Number(input.max);
            const step = Number(input.step || 1);

            return {
                min: Number.isFinite(min) ? min : 0,
                max: Number.isFinite(max) ? max : Number.MAX_SAFE_INTEGER,
                step: Number.isFinite(step) && step > 0 ? step : 1
            };
        }

        function applySpinValue(input, nextValue) {
            const bounds = getInputBounds(input);
            const clamped = clamp(Math.round(nextValue), bounds.min, bounds.max);
            input.value = clamped;
            input.dispatchEvent(new Event("input", {bubbles: true}));
        }

        function changeSpinValue(input, direction) {
            if (input.disabled) {
                return;
            }

            const bounds = getInputBounds(input);
            const current = Number(input.value || 0);
            const safeCurrent = Number.isFinite(current) ? current : bounds.min;
            applySpinValue(input, safeCurrent + direction * bounds.step);
        }

        function startPressRepeat(button, input, direction) {
            let repeatTimer = null;
            let repeatInterval = null;

            const clearRepeat = () => {
                if (repeatTimer) {
                    clearTimeout(repeatTimer);
                    repeatTimer = null;
                }
                if (repeatInterval) {
                    clearInterval(repeatInterval);
                    repeatInterval = null;
                }
            };

            const startRepeat = () => {
                changeSpinValue(input, direction);
                repeatTimer = setTimeout(() => {
                    repeatInterval = setInterval(() => changeSpinValue(input, direction), 60);
                }, 260);
            };

            button.addEventListener("pointerdown", (event) => {
                if (button.disabled) {
                    return;
                }
                event.preventDefault();
                startRepeat();
            });
            button.addEventListener("pointerup", clearRepeat);
            button.addEventListener("pointerleave", clearRepeat);
            button.addEventListener("pointercancel", clearRepeat);
        }

        function attachSpinInput(inputId) {
            const input = document.getElementById(inputId);
            const container = input.closest(".spin-control");
            const decButton = container.querySelector(".spin-dec");
            const incButton = container.querySelector(".spin-inc");

            startPressRepeat(decButton, input, -1);
            startPressRepeat(incButton, input, 1);

            input.addEventListener("wheel", (event) => {
                if (input.disabled) {
                    return;
                }
                event.preventDefault();
                changeSpinValue(input, event.deltaY < 0 ? 1 : -1);
            }, {passive: false});

            let dragState = null;
            input.addEventListener("pointerdown", (event) => {
                if (input.disabled) {
                    return;
                }

                dragState = {
                    startY: event.clientY,
                    startValue: Number(input.value || 0)
                };
                input.setPointerCapture(event.pointerId);
            });

            input.addEventListener("pointermove", (event) => {
                if (!dragState || input.disabled) {
                    return;
                }

                event.preventDefault();
                const bounds = getInputBounds(input);
                const deltaY = dragState.startY - event.clientY;
                const steps = Math.trunc(deltaY / 10);
                const baseValue = Number.isFinite(dragState.startValue) ? dragState.startValue : bounds.min;
                applySpinValue(input, baseValue + steps * bounds.step);
            });

            const stopDrag = (event) => {
                if (!dragState) {
                    return;
                }

                dragState = null;
                if (event && event.pointerId !== undefined && input.hasPointerCapture(event.pointerId)) {
                    input.releasePointerCapture(event.pointerId);
                }
            };

            input.addEventListener("pointerup", stopDrag);
            input.addEventListener("pointercancel", stopDrag);
            input.addEventListener("pointerleave", stopDrag);
        }

        function attachSpinControls() {
            ["timeHourInput", "timeMinuteInput", "timeSecondInput", "paceMinuteInput", "paceSecondInput"].forEach(attachSpinInput);
        }

        function loadWASM() {
            if (!WebAssembly.instantiateStreaming) {
                WebAssembly.instantiateStreaming = async (resp, importObject) => {
                    const source = await (await resp).arrayBuffer();
                    return await WebAssembly.instantiate(source, importObject);
                };
            }

            const go = new Go();
            WebAssembly.instantiateStreaming(fetch(wasmFileName), go.importObject)
                .then((results) => {
                    go.run(results.instance);
                    setInputsDisabled(false);
                    pace();
                })
                .catch((error) => {
                    setError("Не удалось загрузить WebAssembly.");
                    console.error(error);
                });
        }

        document.addEventListener("DOMContentLoaded", function () {
            const slider = $("#slider");
            slider.ionRangeSlider({
                skin: "round",
                min: 0,
                grid: true,
                grid_num: 5,
                from: 21097,
                max: 200000,
                step: 1,
                disable: true,
                onChange: function () {
                    syncDistanceFromSlider();
                    pace();
                }
            });

            sliderInstance = slider.data("ionRangeSlider");
            attachDistanceButtons();
            attachSpinControls();

            document.getElementById("distInput").addEventListener("input", function () {
                syncDistanceToSlider();
                pace();
            });
            document.getElementById("timeHourInput").addEventListener("input", pace);
            document.getElementById("timeMinuteInput").addEventListener("input", pace);
            document.getElementById("timeSecondInput").addEventListener("input", pace);
            document.getElementById("paceMinuteInput").addEventListener("input", time);
            document.getElementById("paceSecondInput").addEventListener("input", time);

            setInputsDisabled(true);
            updatePresetHighlight(Number(document.getElementById("distInput").value));
            loadWASM();
        });
    </script>
</head>
<body>
<div class="app-shell">
    <div class="app-card">
        <div class="headline">
            <h1>Pacer</h1>
            <p>Калькулятор темпа и финишного времени для беговых дистанций.</p>
        </div>

        <div class="section-title">Distance</div>
        <div class="field-group">
            <div class="field-box" style="max-width: 210px;">
                <label for="distInput">Дистанция</label>
                <div class="input-group">
                    <input id="distInput" class="form-control disabled numeric-input" type="number" name="distInput" value="21097"
                           min="0" step="1" disabled>
                    <div class="input-group-append">
                        <span class="input-group-text">метров</span>
                    </div>
                </div>
                <p class="hint">Можно задать вручную или выбрать пресет.</p>
            </div>
            <div class="field-box" style="min-width: 280px;">
                <label for="slider">Выбор дистанции</label>
                <input type="text" class="form-control" id="slider"/>
            </div>
        </div>

        <div class="distance-buttons">
            <button type="button" id="b1km" value="1000" class="btn btn-primary btn-sm disabled" disabled>1 км</button>
            <button type="button" id="b3km" value="3000" class="btn btn-primary btn-sm disabled" disabled>3 км</button>
            <button type="button" id="b5km" value="5000" class="btn btn-primary btn-sm disabled" disabled>5 км</button>
            <button type="button" id="b10km" value="10000" class="btn btn-primary btn-sm disabled" disabled>10 км</button>
            <button type="button" id="b21km" value="21097" class="btn btn-primary btn-sm disabled" disabled>Half Marathon</button>
            <button type="button" id="b42km" value="42195" class="btn btn-primary btn-sm disabled" disabled>Marathon</button>
            <button type="button" id="b50km" value="50000" class="btn btn-primary btn-sm disabled" disabled>50 км</button>
            <button type="button" id="b50mile" value="80467" class="btn btn-primary btn-sm disabled" disabled>50 миль</button>
            <button type="button" id="b100km" value="100000" class="btn btn-primary btn-sm disabled" disabled>100 км</button>
            <button type="button" id="b100mile" value="160934" class="btn btn-primary btn-sm disabled" disabled>100 миль</button>
        </div>

        <div class="section-title">Time</div>
        <div class="field-group">
            <div class="field-box compact-field">
                <label for="timeHourInput">Часы</label>
                <div class="spin-control">
                    <button type="button" class="spin-btn spin-dec disabled" aria-label="Уменьшить часы" disabled>-</button>
                    <input id="timeHourInput" class="form-control disabled numeric-input numeric-input-3" type="number" name="timeHour" value="1" min="0" max="999" inputmode="numeric" disabled>
                    <button type="button" class="spin-btn spin-inc disabled" aria-label="Увеличить часы" disabled>+</button>
                    <span class="spin-unit">ч</span>
                </div>
            </div>
            <div class="field-box compact-field">
                <label for="timeMinuteInput">Минуты</label>
                <div class="spin-control">
                    <button type="button" class="spin-btn spin-dec disabled" aria-label="Уменьшить минуты" disabled>-</button>
                    <input id="timeMinuteInput" class="form-control disabled numeric-input numeric-input-2" type="number" name="timeMinute" value="25" min="0" max="59" inputmode="numeric" disabled>
                    <button type="button" class="spin-btn spin-inc disabled" aria-label="Увеличить минуты" disabled>+</button>
                    <span class="spin-unit">м</span>
                </div>
            </div>
            <div class="field-box compact-field">
                <label for="timeSecondInput">Секунды</label>
                <div class="spin-control">
                    <button type="button" class="spin-btn spin-dec disabled" aria-label="Уменьшить секунды" disabled>-</button>
                    <input id="timeSecondInput" class="form-control disabled numeric-input numeric-input-2" type="number" name="timeSecond" value="39" min="0" max="59" inputmode="numeric" disabled>
                    <button type="button" class="spin-btn spin-inc disabled" aria-label="Увеличить секунды" disabled>+</button>
                    <span class="spin-unit">с</span>
                </div>
            </div>
        </div>

        <div class="section-title">Pace</div>
        <div class="field-group">
            <div class="field-box compact-field">
                <label for="paceMinuteInput">Минуты</label>
                <div class="spin-control">
                    <button type="button" class="spin-btn spin-dec disabled" aria-label="Уменьшить минуты темпа" disabled>-</button>
                    <input id="paceMinuteInput" class="form-control disabled numeric-input numeric-input-3" type="number" name="paceMinute" value="4" min="0" max="999" inputmode="numeric" disabled>
                    <button type="button" class="spin-btn spin-inc disabled" aria-label="Увеличить минуты темпа" disabled>+</button>
                    <span class="spin-unit">м</span>
                </div>
            </div>
            <div class="field-box compact-field">
                <label for="paceSecondInput">Секунды</label>
                <div class="spin-control">
                    <button type="button" class="spin-btn spin-dec disabled" aria-label="Уменьшить секунды темпа" disabled>-</button>
                    <input id="paceSecondInput" class="form-control disabled numeric-input numeric-input-2" type="number" name="paceSecond" value="4" min="0" max="59" inputmode="numeric" disabled>
                    <button type="button" class="spin-btn spin-inc disabled" aria-label="Увеличить секунды темпа" disabled>+</button>
                    <span class="spin-unit">с</span>
                </div>
            </div>
        </div>

        <p id="errorMessage" class="error-text" aria-live="polite"></p>
    </div>
</div>
</body>
</html>
