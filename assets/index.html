<!doctype html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8" name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <meta charset="utf-8"/>

    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("json.wasm"), go.importObject).then((result) => {
            go.run(result.instance);
        });
    </script>

    <style>
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>

    <title>Pacer</title>
</head>
<body>

<div class="container pt-3 my-3">
    <div class="mb-4">
        <div class="mx-auto">
            <h1>Pacer</h1>
        </div>
    </div>

    <form>
        <div class="form-row">
            <div class="form-group col-md-2">
                <label for="distInput">Дистанция</label>
                <div class="input-group">
                    <input id="distInput" class="form-control" type="number"
                           style="-webkit-appearance: none; margin: 0;" name="distInput" value="21097"
                           onkeyup="pace()"/>
                    <div class="input-group-append">
                        <span class="input-group-text">метров</span>
                    </div>
                </div>
            </div>
            <div class="form-group col-md-10">
                <label for="line">&nbsp;</label>
                <input id="line" class="form-control" type="range" min="0" max="160000" oninput="distRangeChange()"
                       value="21097"
                       onchange="pace()">
            </div>
        </div>
        <div class="form-row">
            <div class="form-group col-md-1">
                <label for="timeHourInput">Время</label>
                <div class="input-group">
                    <input id="timeHourInput" class="form-control" type="number" name="timeHour" value="1"
                           onkeyup="pace()">
                    <div class="input-group-append">
                        <span class="input-group-text">ч</span>
                    </div>
                </div>
            </div>
            <div class="form-group col-md-1">
                <label for="timeHourInput">&nbsp;</label>
                <div class="input-group">
                    <input id="timeMinuteInput" class="form-control" type="number" name="timeMinute" value="25"
                           onkeyup="pace()">
                    <div class="input-group-append">
                        <span class="input-group-text">м</span>
                    </div>
                </div>
            </div>
            <div class="form-group col-md-1">
                <label for="timeHourInput">&nbsp;</label>
                <div class="input-group">
                    <input id="timeSecondInput" class="form-control" type="number" name="timeSecond" value="39"
                           onkeyup="pace()">
                    <div class="input-group-append">
                        <span class="input-group-text">с</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group col-md-1">
                <label for="timeHourInput">Темп</label>
                <div class="input-group">
                    <input id="paceMinuteInput" class="form-control" type="number" name="paceMinute" value="4"
                           onkeyup="time()">
                    <div class="input-group-append">
                        <span class="input-group-text">м</span>
                    </div>
                </div>
            </div>
            <div class="form-group col-md-1">
                <label for="timeHourInput">&nbsp;</label>
                <div class="input-group">
                    <input id="paceSecondInput" class="form-control" type="number" name="paceSecond" value="4"
                           onkeyup="time()">
                    <div class="input-group-append">
                        <span class="input-group-text">с</span>
                    </div>
                </div>
            </div>
        </div>
</div>
</form>
</div>

</body>
<script>
    let pace = function () {
        let distInputValue = document.getElementById("distInput").value;

        let dist = Number(distInputValue)
        if (dist === 0) {
            return
        }
        if (dist < 1) {
            distInputValue = ""
        }

        let line = document.getElementById("line");

        if (distInputValue === "") {
            line.value = 0
        } else {
            line.value = distInputValue
        }

        let timeHourValue = document.getElementById("timeHourInput").value;
        let timeMinuteValue = document.getElementById("timeMinuteInput").value;
        let timeSecondValue = document.getElementById("timeSecondInput").value;

        const result = calcPace(dist, timeHourValue, timeMinuteValue, timeSecondValue);
        console.debug("calcPace result: ", result)

        let jsonResult = JSON.parse(result)
        if (jsonResult["error"] != null) {
            console.error("calcPace execution error", jsonResult["error"])
            return
        }

        let minute = jsonResult["minute"]
        let second = jsonResult["second"]

        document.getElementById("paceMinuteInput").value = minute
        document.getElementById("paceSecondInput").value = second

        console.log("success update pace")
    };

    let time = function () {
        let result = calcTime();
        console.debug("calcTime result: ", result)

        let jsonResult = JSON.parse(result)
        if (jsonResult["error"] != null) {
            console.error("calcPace execution error", jsonResult["error"])
            return
        }

        console.log("success update time")
    };

    function distRangeChange() {
        let line = document.getElementById("line").value;
        let distInput = document.getElementById("distInput");

        distInput.value = line;
    }
</script>

</html>
