<html lang="en">
<head>
    <meta charset="utf-8"/>
    <script src="wasm_exec.js"></script>
    <script>
        const go = new Go();
        WebAssembly.instantiateStreaming(fetch("json.wasm"), go.importObject).then((result) => {
            go.run(result.instance);
        });
    </script>
    <title>Pacer</title>
</head>
<body>
<p style="margin-left: 10px;">
    <b>Pacer</b>
</p>

Дистанция
<br/>
<input id="distInput" type="number" style="-webkit-appearance: none; margin: 0;" name="distInput" value="21097"
       onkeyup="pace()"/>метров
<input type="range" min="0" max="100000" id="line" oninput="distRangeChange()" value="21097" style="width: 400px"
       onchange="pace()">
<br/>

Время
<br/>
<input id="timeHourInput" type="number" name="timeHour" value="1" onkeyup="pace()">ч
<input id="timeMinuteInput" type="number" name="timeMinute" value="25" onkeyup="pace()">м
<input id="timeSecondInput" type="number" name="timeSecond" value="39" onkeyup="pace()">с
<br/>

Темп
<br/>
<input id="paceMinuteInput" type="number" name="paceMinute" value="4" onkeyup="time()">м
<input id="paceSecondInput" type="number" name="paceSecond" value="4" onkeyup="time()">с

</body>
<script>
    const pace = function () {
        let distInputValue = document.getElementById("distInput");

        if (Number(distInputValue.value) === 0) {
            return
        }

        if (Number(distInputValue.value) < 1) {
            distInputValue.value = ""
        }

        let line = document.getElementById("line");

        if (distInputValue.value === "") {
            line.value = 0
        } else {
            line.value = distInputValue.value
        }

        const result = calcPace();

        console.log("calcPace return value", result)
    };

    const time = function () {
        const result = calcTime();

        console.log("calcTime return value", result)
    };

    function distRangeChange() {
        let line = document.getElementById("line").value;
        let distInput = document.getElementById("distInput");

        distInput.value = line;
    }
</script>

</html>
